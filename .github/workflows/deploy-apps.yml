name: Deploy apps stack

on:
  push:
    branches: [ci-cd/deploy]
    paths:
      - "docker-compose-apps.yaml"
      - "courses/**"
      - ".github/workflows/deploy-apps.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: mse-courses-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./courses
          file: ./courses/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  redeploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Trigger Portainer apps webhook
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_APPS_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "PORTAINER_APPS_WEBHOOK secret is not set"
            exit 1
          fi
          curl --fail --show-error --silent -k -X POST "$WEBHOOK_URL"
          echo "Apps stack webhook triggered"
