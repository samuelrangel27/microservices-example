services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:latest
    environment:
      SA_PASSWORD: ${SQL_SA_PWD}
      ACCEPT_EULA: "Y"
    ports:
      - 1433:1433
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
  redis_cache:
    image: redis
    container_name: Redis-Cache
    ports:
      - "6379:6379"
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAPHANA_PWD}
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config/loki.yaml
    configs:
      - source: loki_config
        target: /etc/loki/config/loki.yaml

  tempo:
    image: grafana/tempo:latest
    ports:
      - "3200:3200"
    command: -config.file=/etc/tempo/config/tempo.yaml
    configs:
      - source: tempo_config
        target: /etc/tempo/config/tempo.yaml
        
configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: 'prometheus'
          static_configs:
            - targets: ['localhost:9090']

        - job_name: 'loki'
          static_configs:
            - targets: ['loki:3100']

        - job_name: 'tempo'
          static_configs:
            - targets: ['tempo:3200']

        - job_name: 'courses-api'
          static_configs:
            - targets: ['courses-api:80']
  loki_config:
    content: |
      auth_enabled: false

      server:
        http_listen_port: 3100
        grpc_listen_port: 9096

      common:
        instance_addr: 127.0.0.1
        path_prefix: /tmp/loki
        storage:
          filesystem:
            chunks_directory: /tmp/loki/chunks
            rules_directory: /tmp/loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory

      schema_config:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      storage_config:
        filesystem:
          directory: /tmp/loki/chunks

      compactor:
        working_directory: /tmp/loki/compactor

      limits_config:
        reject_old_samples: true
        reject_old_samples_max_age: 168h
  tempo_config:
    content: |
      stream_over_http_enabled: true

      server:
        http_listen_port: 3200

      distributor:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: "0.0.0.0:4317"
              http:
                endpoint: "0.0.0.0:4318"
          zipkin:
            endpoint: "0.0.0.0:9411"
          jaeger:
            protocols:
              thrift_compact:
                endpoint: "0.0.0.0:6831"
              thrift_binary:
                endpoint: "0.0.0.0:6832"
              thrift_http:
                endpoint: "0.0.0.0:14268"
              grpc:
                endpoint: "0.0.0.0:14250"

      storage:
        trace:
          backend: local
          wal:
            path: /tmp/tempo/wal
          local:
            path: /tmp/tempo/blocks

    
